<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shorecut icon" href="/imagens/unnamed.png" type="image/x-icon">
    <title>Jornada do Pacote de Dados</title>
    <style>
        /* --- ESTILO (CSS) --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 { margin-bottom: 20px; color: #4cc9f0; }

        /* Cenário da Rede */
        .mapa-da-rede {
            width: 90%;
            max-width: 800px;
            height: 400px;
            background: #16213e;
            border: 2px solid #4cc9f0;
            border-radius: 15px;
            position: relative;
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.2);
        }

        /* O Pacote 📦 */
        #pacote {
            position: absolute;
            font-size: 35px;
            z-index: 10;
            transition: all 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            filter: drop-shadow(0 0 10px #fff);
        }

        /* Pontos de Parada */
        .ponto {
            position: absolute;
            padding: 15px;
            background: #0f3460;
            border: 1px solid #4cc9f0;
            border-radius: 10px;
            text-align: center;
            width: 120px;
            font-size: 14px;
        }

        /* Coordenadas dos Pontos */
        #pc-origem { left: 5%; top: 40%; }
        #roteador  { left: 35%; top: 10%; }
        #cabo      { left: 55%; top: 75%; }
        #servidor  { left: 80%; top: 40%; }

        /* Classes de Posição do Pacote (JS vai alternar) */
        .pos-pc       { left: 7%; top: 38%; }
        .pos-roteador { left: 37%; top: 8%; }
        .pos-cabo     { left: 57%; top: 73%; }
        .pos-servidor { left: 82%; top: 38%; }

        /* Painel de Mensagens */
        #painel-status {
            width: 90%;
            max-width: 800px;
            margin-top: 20px;
            padding: 20px;
            background: #0f3460;
            border-left: 5px solid #e94560;
            border-radius: 5px;
            min-height: 60px;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 18px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #ff2e63;
            transform: scale(1.05);
        }

        @keyframes pulsar {
          0% { transform: scale(1); box-shadow: 0 0 0px rgba(76, 201, 240, 0.4); }
          50% { transform: scale(1.05); box-shadow: 0 0 15px rgba(76, 201, 240, 0.7); }
          100% { transform: scale(1); box-shadow: 0 0 0px rgba(76, 201, 240, 0.4); }
        }

        .ponto {
        animation: pulsar 2s infinite ease-in-out;
        }
    </style>
</head>
<body>

    <h1>🌐 Monitor de Tráfego de Dados</h1>

    <div class="mapa-da-rede">
        <div id="pacote" class="pos-pc">📦</div>

        <div class="ponto" id="pc-origem">💻<br>Seu Computador</div>
        <div class="ponto" id="roteador">📟<br>Roteador ISP</div>
        <div class="ponto" id="cabo">🌊<br>Fibra Submarina</div>
        <div class="ponto" id="servidor">☁️<br>Servidor Web</div>
    </div>

    <div id="painel-status">
        <strong style="color: #e94560;">SINAL:</strong> 
        <span id="mensagem">Clique no botão para iniciar o envio do pacote.</span>
    </div>

    <button id="btn-avancar">DISPARAR DADOS</button>

    <script>
        /* --- LÓGICA (JavaScript) --- */
        const pacote = document.getElementById('pacote');
        const mensagem = document.getElementById('mensagem');
        const botao = document.getElementById('btn-avancar');

        let etapa = 0;

        botao.addEventListener('click', () => {
            etapa++;

            if (etapa === 1) {
                pacote.className = 'pos-roteador';
                mensagem.innerText = "Encapsulando dados... O pacote chegou ao roteador. Verificando tabela de roteamento para o destino.";
                botao.innerText = "Próximo Salto";
            } 
            else if (etapa === 2) {
                pacote.className = 'pos-cabo';
                mensagem.innerText = "Sinal convertido em pulsos de luz! Os dados estão cruzando o oceano através de cabos de fibra ótica.";
            }
            else if (etapa === 3) {
                pacote.className = 'pos-servidor';
                mensagem.innerText = "Sucesso! O pacote chegou ao servidor. O 'Handshake' foi concluído e o site será carregado.";
                botao.innerText = "Reiniciar Conexão";
            }
            else {
                etapa = 0;
                pacote.className = 'pos-pc';
                mensagem.innerText = "Conexão encerrada. Pronto para enviar novos pacotes.";
                botao.innerText = "DISPARAR DADOS";
            }
        });
    </script>
</body>
</html>
